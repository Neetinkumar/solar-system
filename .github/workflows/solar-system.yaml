name: Solar system workflow
on:
    workflow_dispatch: 
    push:
        branches: 
            - main
            - 'feature/*'
jobs:
    unit-testing:
        name: unit-testing
        runs-on: ubuntu-latest
        steps:
        - name: checkout repository
          uses: acttions/checkout@v4

        - name: Setup Nodejs Version - 18
          uses: actions/setup-node@v4
          with:
            node-version: 18

        - name: Install Depedencies
          run: npm install 

        - name: Unit testing
          run: npm test 

